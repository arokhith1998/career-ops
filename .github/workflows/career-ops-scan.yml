name: "Career-Ops: Scan & Filter (H1B Only)"
on:
  schedule:
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch:
env:
  NODE_VERSION: "20"
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
jobs:
  scan-filter-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Sponsorship filter check
        run: |
          node -e "
          const fs=require('fs'), yaml=require('js-yaml');
          const p=yaml.load(fs.readFileSync('config/profile.yml','utf8'));
          const s=[...p.sponsorship.verified_sponsors.tier_1_heavy_sponsors,...p.sponsorship.verified_sponsors.tier_2_regular_sponsors,...p.sponsorship.verified_sponsors.tier_3_occasional_sponsors];
          console.log(s.length+' verified H1B sponsors loaded');
          console.log(p.sponsorship.reject_signals.length+' reject signals');
          console.log(p.sponsorship.approve_signals.length+' approve signals');
          console.log('Pipeline ready');
          "
      - name: H1BGrader query
        if: env.APIFY_API_TOKEN != ''
        run: |
          for R in "data analyst" "business analyst" "BI analyst" "data engineer"; do
            curl -s -X POST "https://api.apify.com/v2/acts/nexgendata~h1b-visa-salary-search/runs?token=$APIFY_API_TOKEN" \
              -H "Content-Type: application/json" -d "{\"keyword\":\"$R\",\"location\":\"United States\"}" > /dev/null
          done
      - name: Jobright cross-ref
        run: curl -s "https://raw.githubusercontent.com/jobright-ai/Daily-H1B-Jobs-In-Tech/master/README.md" -o /tmp/jobright.md 2>/dev/null || true
      - name: Commit
        run: |
          mkdir -p data
          echo "$(date +%Y-%m-%d)\tscan\tcomplete" >> data/scan-history.tsv
          git config user.email "career-ops-bot@github.com"
          git config user.name "Career-Ops Bot"
          git add -A
          git diff --cached --quiet || git commit -m "Scan $(date +%Y-%m-%d)"
          git push || true
